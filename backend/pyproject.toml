[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charity-status-backend"
version = "0.1.0"
description = "Executable backend runtime workspace scaffolding for Charity Status API."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "bcrypt",
  "boto3",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
  "zipfile64>=0.1.0",
]
license = { text = "TBD" }
authors = [{ name = "Charity Status Contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
  "alembic>=1.13,<2.0",
  "debugpy>=1.8,<2.0",
  "pytest",
]

[tool.uv]
# The backend currently spans several source roots that contribute to the same
# namespace. Keep uv responsible for the environment until those roots become
# independently packaged workspace members.
package = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [
  "customer-api/src",
  "platform-api/src",
  "worker/src",
  "shared/src",
  "ingest/federal/src",
  "ingest/state/src",
  "ingest/shared/src",
]
include = ["verification*"]
namespaces = true
